[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tenantkiller"
version = "0.1.2"
description = "Semantic mutation testing for Django tenant-isolation tests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mengchao Ren" }]
keywords = ["django", "security", "multi-tenancy", "mutation-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mengchar-cmu-F25/tenantkiller"
Issues = "https://github.com/mengchar-cmu-F25/tenantkiller/issues"

[project.scripts]
tenantkiller = "tenantkiller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
