[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tenantkiller"
version = "0.1.0"
description = "Semantic mutation testing for Django tenant-isolation tests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mengchao Ren" }]
keywords = ["django", "security", "multi-tenancy", "mutation-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
tenantkiller = "tenantkiller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

