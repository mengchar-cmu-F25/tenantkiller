name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: tenantkiller list examples/django_like
      - run: python -m pip install "Django>=5.2,<5.3"
      - name: Weak Django test misses the removed scope
        run: |
          exit_code=0
          tenantkiller run --select TK-8106FC62D1 examples/django_tenants -- python -m unittest -q checks.WeakIsolationTest || exit_code=$?
          test "$exit_code" -eq 1
      - name: Strong Django test catches the removed scope
        run: tenantkiller run --select TK-8106FC62D1 --show-output examples/django_tenants -- python -m unittest -q checks.StrongIsolationTest
